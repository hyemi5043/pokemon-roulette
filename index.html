 claim:id=>{const d=daily();const m=id==='all'?MIS_ALL:MIS.find(x=>x.id===id);const cur=id==='all'?misDone():(d.m[id]||0);if(d.cl[id]||cur<m.goal)return;d.cl[id]=1;give(m.rw[0],m.rw[1]);sfx('buy');toast(`${rwTxt(m.rw)} 획득!`);render();updHud();updDots()},
 ach:id=>{const a=ACH.find(x=>x.id===id);if(G.ach[id]||!a.chk())return;G.ach[id]=1;give(a.rw[0],a.rw[1]);sfx('buy');toast(`${rwTxt(a.rw)} 획득!`);render();updHud();updDots()},
 snd:()=>{G.snd=!G.snd;render()},rename:()=>askName(G.name).then(n=>{G.name=n;updHud();render()}),
 reset:()=>modal(`<h3>정말 초기화할까요?</h3><p class="note" style="text-align:center">모든 진행 상황이 사라지고 되돌릴 수 없어요.</p><div class="row" style="margin-top:10px"><button class="btn r" style="flex:1" data-act="reset2">초기화</button><button class="btn dk" style="flex:1" data-act="close">취소</button></div>`),
 reset2:()=>{localStorage.removeItem('hana_idle_v1');location.reload()},
 offline:()=>{if(!G.pend)return;G.gold+=G.pend.gold;G.gems+=G.pend.gems;G.pend=null;$('#dMail').classList.remove('on');closeModal();sfx('buy');updHud()},
};
function askName(def){return new Promise(res=>{modal(`<h3>트레이너 이름</h3><input class="nm" id="nmIn" maxlength="10" value="${esc(def||'')}"><button class="btn" style="width:100%" id="nmOk">결정</button>`);
 const ok=()=>{const v=($('#nmIn').value||'').trim()||'트레이너';closeModal();res(v.slice(0,10))};$('#nmOk').onclick=ok;$('#nmIn').onkeydown=e=>{if(e.key==='Enter')ok()};setTimeout(()=>$('#nmIn').focus(),50)})}
function starterPick(){return new Promise(res=>{const ids=[495,498,501];modal(`<h3>첫 파트너를 골라 주세요</h3><div class="grid5" style="grid-template-columns:repeat(3,1fr)" data-noclick>${ids.map(id=>`<div data-act="st:${id}">${cardH(id,{res:1})}</div>`).join('')}</div><p class="note" style="text-align:center">고른 뒤 무료 뽑기 티켓 10장으로 파티를 채워 보세요!</p>`);
 ACT.st=id=>{G.own[+id]={lv:3,star:0,sh:0};G.party=[+id];buildTeam();closeModal();res()}})}
function offlineCheck(){const dt=Math.min(12*3600,(Date.now()-(G.last||Date.now()))/1000);if(dt<60)return;const kills=Math.floor(dt/2.5);const gold=kills*gpk(G.stage);const gems=Math.floor(dt/60)*3;G.pend={gold,gems};$('#dMail').classList.add('on');
 const h=Math.floor(dt/3600),m=Math.floor(dt%3600/60);modal(`<h3>오프라인 보상</h3><p style="text-align:center">${h?h+'시간 ':''}${m}분 동안 원정대가 활약했어요!</p><div class="stc" style="margin-top:10px"><div>금화<b>${fmt(gold)}</b></div><div>다이아<b>${fmt(gems)}</b></div><div>처치<b>${fmt(kills)}</b></div></div>
 <button class="btn y" style="width:100%" data-act="offline">받기</button><p class="note" style="text-align:center">최대 12시간까지 쌓여요.</p>`)}
// nav / buttons
document.querySelectorAll('#nav button[data-v]').forEach(b=>b.onclick=()=>{ac();openView(b.dataset.v)});
$('#ptog').onclick=()=>{const c=$('#panel').classList.contains('closed');if(c&&!curView)curView='grow';togglePanel(c);if(c)render()};
$('#bossBtn').onclick=()=>{ac();summonBoss()};$('#autoT').onclick=()=>{G.autoBoss=!G.autoBoss;updHud();toast(G.autoBoss?'보스 자동 소환·재도전 켜짐':'보스 자동 소환 꺼짐')};
$('#sbMis').onclick=()=>openView('mis');$('#sbSnd').onclick=()=>{G.snd=!G.snd;toast(G.snd?'사운드 켜짐':'사운드 꺼짐')};
$('#sbMail').onclick=()=>{if(G.pend)modal(`<h3>오프라인 보상</h3><div class="stc"><div>금화<b>${fmt(G.pend.gold)}</b></div><div>다이아<b>${fmt(G.pend.gems)}</b></div></div><button class="btn y" style="width:100%" data-act="offline">받기</button>`);else toast('받을 보상이 없어요')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(G){offlineCheck()}});addEventListener('pagehide',save);
// boot
function loading(on,p,msg){let e=$('#loadov');if(!e){e=document.createElement('div');e.id='loadov';e.style.cssText='position:absolute;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#2a3466,#0b0e18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px';$('#app').appendChild(e)}
 if(!on){e.remove();return}e.innerHTML=`<div style="font-size:30px;font-weight:900;letter-spacing:-.02em">포켓몬 하나 원정대</div><div style="color:#9ab;font-size:13px">${msg}</div><div style="width:70%;height:8px;background:#0a0d18;border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:linear-gradient(90deg,#3ad0c0,#4ab0ff);transition:width .3s"></i></div>`}
async function boot(){resize();loading(true,5,'전국 포켓몬 데이터 확인 중…');const how=await loadDex(p=>loading(true,p,'전국 포켓몬 1025종 데이터를 받는 중… (첫 실행 1회)'));rebuildPools();loading(false);
 if(how==='offline')setTimeout(()=>toast(`오프라인: 내장 ${POOL.length}종으로 진행 (온라인 접속 시 1025종)`),800);requestAnimationFrame(loop);const s=load();
 if(s){G=s;G.pend=null;if(!G.newIds)G.newIds={};for(const id in G.own)if(!EMB[id])delete G.own[id];G.party=G.party.filter(id=>EMB[id]);buildTeam();updHud();updDots();offlineCheck();curView='grow';togglePanel(false)}
 else{G=newState('트레이너');G.last=Date.now();updHud();G.name=await askName('트레이너');await starterPick();updHud();save();curView='gacha';curSub.gacha=0;togglePanel(true);render();toast('무료 티켓 10장으로 10회 뽑기를 해 보세요!')}
 daily();updDots()}
boot();

</script>
</body></html>
